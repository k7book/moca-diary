<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>모카 일지</title>
  <meta name="theme-color" content="#f6efe3" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title"><span class="logo">🦎</span> <span id="pet-title">모카 일지</span></div>
      <button class="icon-btn" id="btn-terms" title="용어 바꾸기">가</button>

    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <a href="#today" data-tab="today"><span class="tab-ico">☀️</span><span>오늘</span></a>

    </nav>

    <div id="toast" class="toast" hidden></div>
    <div id="modal" class="modal" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
